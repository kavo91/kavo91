<svg xmlns="http://www.w3.org/2000/svg" width="65" height="65" viewBox="0 0 64 64">
  <!-- Sauna Sessions launcher icon: heat (ember flame, top-left) vs ice (frost wave, bottom-right)
       on the watch's black. Two shapes only so it still reads at 40 px. -->
  <defs>
    <clipPath id="disc"><circle cx="32" cy="32" r="31"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="31" fill="#000000"/>
  <g clip-path="url(#disc)">
    <!-- ember half -->
    <path d="M0 0H64L0 64Z" fill="#1A0A04"/>
    <!-- ice half -->
    <path d="M64 0V64H0Z" fill="#04101A"/>
    <!-- flame -->
    <g transform="translate(32 32) scale(1.15) translate(-32 -32)">
    <path d="M22 40c-6-6-4-14 2-19 0 5 3 7 5 8-1-5 1-10 6-13-1 6 4 8 6 13 2 6-1 12-8 14 2-3 2-6 0-8-1 3-4 4-6 4 1-2 1-4-1-6-2 2-4 4-4 7z" fill="#FF6A1F"/>
    <path d="M27 38c-2-3-1-6 2-8 0 3 2 4 3 4 0-3 1-5 3-6 0 3 2 4 3 7 0 3-2 6-5 6 1-1 1-3 0-4-1 1-2 2-3 2 0-1 0-2-1-3-1 1-2 2-2 2z" fill="#FFD23F"/>
    <!-- frost wave -->
    <path d="M30 54c4-6 8-6 12 0s8 6 12 0v-8c-4 6-8 6-12 0s-8-6-12 0z" fill="#4FC3F7"/>
    <path d="M36 44c4-5 8-5 12 0s8 5 12 0v-6c-4 5-8 5-12 0s-8-5-12 0z" fill="#B3E5FC" opacity="0.9"/>
    </g>
  </g>
  <circle cx="32" cy="32" r="30.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.5"/>
</svg>
